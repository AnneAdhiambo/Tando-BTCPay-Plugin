openapi: 3.0.3
info:
  title: Tando BTCPay Plugin API
  description: >
    Merchant onboarding, subscriptions, products, employees, and BTC/M-Pesa split
    payments for the Tando BTCPay Server plugin. All routes are Greenfield-style
    endpoints under `/plugins/api/tando`, authenticated with a BTCPay API key.

    Two kinds of key call this API. The Tando backend holds a server-admin key
    and uses it for subscriptions, signup, issuing app keys, and reporting the
    M-Pesa side of a split. It is never a member of merchant stores. Each owner
    and employee gets their own key (returned by signup or `/users/api-keys`),
    which the mobile app uses for everything under `/stores/{storeId}`.
  version: "0.1.0"
servers:
  - url: https://{host}/plugins/api/tando
    variables:
      host:
        default: your-btcpay-instance.example.com

security:
  - ApiKey: []

tags:
  - name: Subscription
    description: Operator-designated plan status/lookup (Phase 1)
  - name: Onboarding
    description: Merchant signup, store + Lightning provisioning (Phase 2)
  - name: Products
    description: Product catalog for the Keypad/Cart POS apps (Phase 3)
  - name: Split Payments
    description: BTC/M-Pesa breakdown per sale, manual-confirmation model (Phase 4)
  - name: Employees
    description: Secondary/staff account management (Phase 5)

paths:
  /subscription/status:
    get:
      tags: [Subscription]
      summary: Get a phone number's subscription status
      description: >
        No subscriber record yet -> Active=false, Configured reflects whether the
        designated plan is currently valid. Existing subscriber -> Active reflects
        their own subscription standing, independent of whether it still matches
        the currently-designated plan.
      security: [{ ApiKey: [CanModifyServerSettings] }]
      parameters:
        - name: phoneNumber
          in: query
          required: true
          schema: { type: string, example: "0712345678" }
          description: Kenyan MSISDN, 07xxxxxxxx / 01xxxxxxxx or +254 form.
      responses:
        "200":
          description: Status resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoSubscriptionStatus" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /subscription/plans:
    get:
      tags: [Subscription]
      summary: List active plans on the designated subscription offering
      security: [{ ApiKey: [CanModifyServerSettings] }]
      responses:
        "200":
          description: Plan list (empty/configured=false if nothing is designated yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/TandoPlan" }

  /signup:
    post:
      tags: [Onboarding]
      summary: Merchant signup - creates/reuses a free trial subscription and provisions a store
      description: >
        Called by the Tando backend after it has verified the phone number.
        Creates (or reuses) a BTCPay user for the merchant and makes that user
        the store's only Owner; the backend key is not added to the store.
        Returns a new API key for the merchant's app on every call.

        Idempotent by phone number: if the merchant already owns a store for this
        MSISDN it is reused (AlreadyExisted=true) rather than duplicated. Auto-enrolls
        a new subscriber into a free trial of the operator-designated plan if the
        phone number has no active subscription yet. Also provisions the Keypad and
        Cart POS apps on the store.
      security: [{ ApiKey: [CanModifyServerSettings] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoSignupRequest" }
      responses:
        "200":
          description: Store ready (created or reused), with the merchant's new API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoSignupResponse" }
        "400":
          description: >
            `phone_number_required`, `invalid_phone_number`,
            `merchant_user_creation_failed` or `store_creation_failed`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Subscription plan not configured / not usable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /users/api-keys:
    post:
      tags: [Onboarding]
      summary: Issue an app key to an existing owner or employee
      description: >
        Login for anyone who already has access to a store: an owner on a new
        phone, or an employee the owner has invited. Called by the Tando backend
        after it has verified the phone number. Returns a new API key plus the
        stores the user belongs to and their role on each, so the app can choose
        between the owner and point-of-sale screens.
      security: [{ ApiKey: [CanModifyServerSettings] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoIssueAppKeyRequest" }
      responses:
        "200":
          description: Key issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoIssueAppKeyResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`no_store_access`: no user for this phone, or the user belongs to no store"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /stores/{storeId}/lightning/connect:
    put:
      tags: [Onboarding]
      summary: Attach a Lightning node connection string to the store
      description: >
        Attaches Lightning to the store, either from an existing connection
        string or by provisioning one through a supported provider (phoenixd or
        NWC). Called with the merchant's own key; a store the caller is not a
        member of is rejected by BTCPay with 403.
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoConnectLightningRequest" }
      responses:
        "200":
          description: Payment method attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  storeId: { type: string }
                  paymentMethodId: { type: string, example: "BTC-LN" }
        "400":
          description: "`connection_string_required`, `unsupported_provider_type`, or a provisioning error"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores/{storeId}/products:
    get:
      tags: [Products]
      summary: List products from the store's Cart (or Keypad) app
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Product list (empty array if no POS/Cart app exists yet)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TandoProductResponse" }
    post:
      tags: [Products]
      summary: Add a product (synced to both the Keypad and Cart apps)
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoCreateProductRequest" }
      responses:
        "200":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoProductResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Store has no POS/Cart apps yet (onboarding incomplete)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /stores/{storeId}/products/{itemId}:
    delete:
      tags: [Products]
      summary: Remove a product (synced to both the Keypad and Cart apps)
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Removed }
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{storeId}/mpesa:
    get:
      tags: [Split Payments]
      summary: Get the store's M-Pesa payout destination
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Current M-Pesa settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoMpesaSettingsResponse" }
        "404":
          description: Not configured yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [Split Payments]
      summary: Set the store's M-Pesa payout destination
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoMpesaSettingsRequest" }
      responses:
        "200": { description: Saved }
        "400":
          description: Validation failed (bad phone/till/paybill format)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{storeId}/split-config:
    get:
      tags: [Split Payments]
      summary: Get the store's split percentage config
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Current config (MpesaPercentage=0 if never set - no split)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoSplitConfigResponse" }
    put:
      tags: [Split Payments]
      summary: Set the store's split percentage
      description: >
        Flat store-wide percentage (v1) of each sale routed to M-Pesa; the
        remainder stays BTC. Rejected if MpesaPercentage > 0 and no M-Pesa
        destination has been set yet via PUT /stores/{storeId}/mpesa.
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoSplitConfigRequest" }
      responses:
        "200": { description: Saved }
        "400":
          description: >
            `invalid_percentage`, `mpesa_destination_required`, or
            `treasury_not_configured` (a percentage above 0 while the Tando team
            hasn't set a treasury Lightning address)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{storeId}/invoices/{invoiceId}/split:
    get:
      tags: [Split Payments]
      summary: Get the recorded split breakdown for an invoice
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Recorded breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoSplitRecord" }
        "404":
          description: "`split_not_recorded`: no split has been recorded for this invoice yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Split Payments]
      summary: Compute and record the split breakdown for an invoice
      description: >
        Only a settled invoice can be split. Splits are also recorded
        automatically when an invoice settles and the store's percentage is above
        0, so this call is mainly for stores at 0% or for retrying.

        The split is taken from the amount actually paid, capped at the invoice
        price: an invoice marked settled without payment splits nothing, and an
        overpayment stays on the BTC side.

        Idempotent - if a breakdown is already recorded for this invoice, that
        existing record is returned as-is rather than recomputed, so a later
        change to the store's split config never retroactively alters a past
        sale's breakdown.
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Breakdown recorded (or already-existing record returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoSplitRecord" }
        "400":
          description: >
            `invoice_not_settled` (only a settled invoice can be split) or
            `treasury_not_configured` (the store has a percentage above 0 but no
            treasury Lightning address is set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores/{storeId}/splits:
    get:
      tags: [Split Payments]
      summary: List the recorded splits for the store, newest first
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
        - name: take
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Recorded splits (invoices without a split are not listed)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TandoSplitRecord" }

  /stores/{storeId}/invoices/{invoiceId}/split/settle:
    put:
      tags: [Split Payments]
      summary: Mark the M-Pesa leg of a split as manually settled
      description: >
        Operator only. Called by the Tando backend once the M-Pesa portion has
        been paid out. A merchant key gets 403: merchants can't mark their own
        payout as done. Idempotent once already settled.
      security: [{ ApiKey: [CanModifyServerSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200": { description: Marked settled }
        "400":
          description: "`split_not_recorded`: no split recorded for this invoice yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`invoice_not_found`: no such invoice on this store"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /stores/{storeId}/invoices/{invoiceId}/split/mpesa-payout-status:
    put:
      tags: [Split Payments]
      summary: Report the status of the M-Pesa payout for a split
      description: >
        Operator only. Called by the Tando backend (or its PSP callback) as the
        M-Pesa payout progresses. `Confirmed` also marks the split's M-Pesa leg
        settled. A merchant key gets 403.
      security: [{ ApiKey: [CanModifyServerSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoUpdateMpesaPayoutStatusRequest" }
      responses:
        "200": { description: Status recorded }
        "400":
          description: "`split_not_recorded`: no split recorded for this invoice yet"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`invoice_not_found`: no such invoice on this store"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /stores/{storeId}/employees:
    get:
      tags: [Employees]
      summary: List employee (staff) accounts on the store
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Employees with BTCPay's built-in Employee store role
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId: { type: string }
                    email: { type: string }
                    phoneNumber: { type: string, nullable: true }
    post:
      tags: [Employees]
      summary: Invite (or re-add) an employee by phone number
      description: >
        Creates a BTCPay user for the phone number (synthetic
        `{phone}@bitcoin.co.ke` email with a random password nobody uses, same as
        merchant signup) if one doesn't already exist, then grants BTCPay's native
        Employee store role - POS/invoice access, no store settings or wallet
        access. The employee then gets their own key from `/users/api-keys`.
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TandoInviteEmployeeRequest" }
      responses:
        "200":
          description: Employee invited/attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TandoEmployeeResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /stores/{storeId}/employees/{userId}:
    delete:
      tags: [Employees]
      summary: Revoke an employee's access to the store
      description: >
        Only users with the Employee role can be revoked here; owners and
        unknown users are refused. If the employee no longer belongs to any
        store, the app keys issued to them are deleted too.
      security: [{ ApiKey: [CanModifyStoreSettings] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Access revoked }
        "400":
          description: "`cannot_remove_last_owner_or_user_not_found`: not an employee of this store"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: >
        BTCPay Greenfield API key, sent as `Authorization: token <api-key>`.
        Subscription, signup, `/users/api-keys`, `split/settle` and
        `split/mpesa-payout-status` need `btcpay.server.canmodifyserversettings`
        (the Tando backend's key). The other `/stores/{storeId}/...` endpoints
        need `btcpay.store.canmodifystoresettings` from a user who belongs to
        that store (the merchant's or employee's own key, as issued by signup or
        `/users/api-keys`). BTCPay answers 403 when the caller isn't a member of
        the store, which includes a store or invoice id that doesn't exist.

  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: string }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: >
        The key lacks the required permission, or the caller is not a member of
        the store (BTCPay also answers 403 for an unknown store or invoice id
        on store-scoped routes)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string, example: "invalid_phone_number" }
        message: { type: string, nullable: true }
        detail: { nullable: true }
        field: { type: string, nullable: true }

    TandoSubscriptionStatus:
      type: object
      properties:
        active: { type: boolean }
        configured: { type: boolean }
        planId: { type: string, nullable: true }
        phase: { type: string, nullable: true, example: "Trial" }

    TandoPlan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number, format: decimal }
        currency: { type: string, example: "KES" }

    TandoSignupRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string, example: "0712345678" }
        deviceName:
          type: string
          nullable: true
          description: Label for the issued key, so the merchant can tell their devices apart.

    TandoSignupResponse:
      type: object
      properties:
        storeId: { type: string }
        userId: { type: string, description: The merchant's BTCPay user id }
        phoneNumber: { type: string }
        alreadyExisted: { type: boolean }
        apiKey: { type: string, description: "The merchant's own API key, for their app. Never stored by Tando." }
        posAppId: { type: string, nullable: true }
        cartAppId: { type: string, nullable: true }

    TandoIssueAppKeyRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string, example: "0712345678" }
        deviceName: { type: string, nullable: true }

    TandoIssueAppKeyResponse:
      type: object
      properties:
        userId: { type: string }
        phoneNumber: { type: string }
        apiKey: { type: string }
        stores:
          type: array
          items: { $ref: "#/components/schemas/TandoStoreAccess" }

    TandoStoreAccess:
      type: object
      properties:
        storeId: { type: string }
        storeName: { type: string }
        role: { type: string, nullable: true, example: "Owner", description: "Owner or Employee" }

    TandoConnectLightningRequest:
      type: object
      description: Send either `connectionString` or `lightningProvision`.
      properties:
        connectionString: { type: string, nullable: true, example: "type=clightning;server=unix://...;" }
        lightningProvision: { $ref: "#/components/schemas/TandoLightningProvisionRequest" }

    TandoLightningProvisionRequest:
      type: object
      nullable: true
      properties:
        providerType: { type: string, enum: [Phoenixd, Nwc] }
        phoenixdServerUrl: { type: string, nullable: true }
        phoenixdApiPassword: { type: string, nullable: true }
        nwcConnectionUri: { type: string, nullable: true }

    TandoCreateProductRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        price: { type: number, format: decimal, minimum: 0 }
        imageUrl: { type: string, nullable: true }

    TandoProductResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number, format: decimal, nullable: true }
        imageUrl: { type: string, nullable: true }

    TandoMpesaDestinationType:
      type: string
      enum: [MobileNumber, TillNumber, PayBill]

    TandoMpesaSettingsRequest:
      type: object
      properties:
        destinationType: { $ref: "#/components/schemas/TandoMpesaDestinationType" }
        destination:
          type: string
          nullable: true
          description: Kenyan MSISDN for MobileNumber, or 5-10 digit number for TillNumber/PayBill.
        accountNumber:
          type: string
          nullable: true
          description: Optional, PayBill only.

    TandoMpesaSettingsResponse:
      type: object
      properties:
        destinationType: { $ref: "#/components/schemas/TandoMpesaDestinationType" }
        destination: { type: string, nullable: true }
        accountNumber: { type: string, nullable: true }

    TandoSplitConfigRequest:
      type: object
      required: [mpesaPercentage]
      properties:
        mpesaPercentage: { type: number, format: decimal, minimum: 0, maximum: 100 }

    TandoSplitConfigResponse:
      type: object
      properties:
        mpesaPercentage: { type: number, format: decimal }

    TandoSplitRecord:
      type: object
      properties:
        totalAmount: { type: number, format: decimal, description: The invoice price }
        paidAmount: { type: number, format: decimal, description: "What the customer actually paid. The split is taken from this, capped at totalAmount." }
        currency: { type: string, example: "KES" }
        btcPortionAmount: { type: number, format: decimal }
        mpesaPortionAmount: { type: number, format: decimal }
        mpesaPercentage: { type: number, format: decimal }
        mpesaDestinationType: { $ref: "#/components/schemas/TandoMpesaDestinationType" }
        mpesaDestination: { type: string, nullable: true }
        mpesaSettled: { type: boolean }
        mpesaSettledAt: { type: string, format: date-time, nullable: true }
        recordedAt: { type: string, format: date-time }
        pullPaymentId: { type: string, nullable: true }
        pullPaymentStatus: { type: string, enum: [NotApplicable, Created, Claimed, Failed] }
        pullPaymentError: { type: string, nullable: true }
        mpesaPayoutStatus: { $ref: "#/components/schemas/TandoMpesaPayoutStatus" }
        mpesaPayoutReference: { type: string, nullable: true }
        mpesaPayoutError: { type: string, nullable: true }

    TandoMpesaPayoutStatus:
      type: string
      enum: [NotTriggered, Triggered, Confirmed, Failed]

    TandoUpdateMpesaPayoutStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TandoMpesaPayoutStatus" }
        payoutReference: { type: string, nullable: true }
